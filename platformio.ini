; ESP32 Wake-on-LAN Controller (SinricPro + Google Home / Alexa)
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

[env:esp32dev]
; pioarduino = Arduino-ESP32 core 3.2.0 (ESP-IDF 5.4.1).
; The official "espressif32" platform only ships core 2.x.
; Core 3.3.x (IDF 5.5) adds ~20KB of lwip/WiFi code and the firmware no longer
; fits the 1.25MB OTA slot with any headroom, so stay on 3.2.0 until the
; partition table can change (see the note below).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32dev
framework = arduino

; Match the Arduino IDE "ESP32 Dev Module" image: 4MB, DIO @ 80MHz, default
; partition table (2 x 1.25MB OTA slots). Do NOT change the partition table,
; otherwise OTA updates from devices already in the field will break.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB
board_build.partitions = default.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; Pinned to exact versions so every build is reproducible.
lib_deps =
    sinricpro/SinricPro @ 5.1.0
    links2004/WebSockets @ 2.7.3
    bblanchon/ArduinoJson @ 7.4.3
    a7md0/WakeOnLan @ 1.1.7

build_flags =
    -Wall
    ; SinricPro 5 local (LAN/UDP) control stays on; only its mDNS announcement
    ; (~7.5KB, not needed: the app reaches the device by its cloud-reported IP)
    ; is dropped to keep headroom in the OTA slot.
    -D SINRICPRO_NOMDNS
    ; -D ENABLE_DEBUG       ; SinricPro serial debug output
    ; -D SINRICPRO_NOSSL    ; use if you run into memory limitations
